<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sumanth Sports Club</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07111d;
            color: white;
        }

        /* =========================
           NAVBAR
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            background: rgba(0, 0, 0, 0.85);
        }

        .navbar {
            max-width: 1200px;

            margin: auto;

            padding: 18px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .logo span {
            color: #ffc107;
        }

        .nav-links {
            list-style: none;

            display: flex;

            gap: 25px;
        }

        .nav-links a {
            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffc107;
        }


        /* =========================
           STADIUM SLIDESHOW
        ========================= */

        .home {
            height: 100vh;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            padding: 120px 8%;
        }

        /* Background images */

        .slide {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-size: cover;

            background-position: center;

            opacity: 0;

            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        /* Dark overlay */

        .home::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.85),
                    rgba(0,0,0,0.45),
                    rgba(0,0,0,0.65)
                );

            z-index: 2;
        }


        /* =========================
           HOME CONTENT
        ========================= */

        .home-content {
            position: relative;

            z-index: 5;

            max-width: 700px;
        }

        .welcome {
            color: #ffc107;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 5px;

            margin-bottom: 15px;
        }

        .home h1 {
            font-size: 70px;

            line-height: 1;

            margin-bottom: 25px;
        }

        .home h1 span {
            color: #ffc107;
        }

        .home p {
            font-size: 20px;

            line-height: 1.7;

            color: #eee;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;

            padding: 15px 30px;

            background: #ffc107;

            color: #111;

            text-decoration: none;

            font-weight: bold;

            border-radius: 5px;

            margin-right: 10px;

            transition: 0.3s;
        }

        .btn:hover {
            background: white;
        }

        .btn-outline {
            display: inline-block;

            padding: 13px 30px;

            border: 2px solid #ffc107;

            color: #ffc107;

            text-decoration: none;

            font-weight: bold;

            border-radius: 5px;
        }

        .btn-outline:hover {
            background: #ffc107;

            color: #111;
        }


        /* =========================
           SLIDE INDICATORS
        ========================= */

        .dots {
            position: absolute;

            bottom: 35px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;

            gap: 10px;
        }

        .dot {
            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: white;

            opacity: 0.5;

            cursor: pointer;

            transition: 0.3s;
        }

        .dot.active {
            background: #ffc107;

            opacity: 1;

            transform: scale(1.3);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                gap: 15px;

                flex-wrap: wrap;

                justify-content: center;
            }

            .home {
                text-align: center;

                justify-content: center;
            }

            .home h1 {
                font-size: 45px;
            }

            .home p {
                font-size: 16px;
            }

            .btn,
            .btn-outline {
                margin: 5px;
            }
        }

    </style>

</head>

<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🏆 SUMANTH
                <span>SPORTS CLUB</span>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="Sports.html">Sports</a>
                </li>

                <li>
                    <a href="events.html">Events</a>
                </li>

                <li>
                    <a href="register.html">Register</a>
                </li>
                <li>
                    <a href="contact.html">contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         HOME SLIDESHOW
    ========================= -->

    <section class="home">


        <!-- Stadium Image 1 -->

        <div
            class="slide active"
            style="background-image: url('stadium1.png');">
        </div>


        <!-- Stadium Image 2 -->

        <div
            class="slide"
            style="background-image: url('stadium2.png');">
        </div>


        <!-- Stadium Image 3 -->

        <div
            class="slide"
            style="background-image: url('stadium3.png');">
        </div>


        <!-- Stadium Image 4 -->

        <div
            class="slide"
            style="background-image: url('stadium4.png');">
        </div>


        <!-- Content -->

        <div class="home-content">

            <div class="welcome">
                WELCOME TO
            </div>

            <h1>
                SUMANTH
                <br>
                <span>SPORTS CLUB</span>
            </h1>

            <p>
                Play with passion.
                Train with dedication.
                Build your skills.
                Become a champion.
            </p>

            <div class="buttons">

                <a href="#sports" class="btn">
                    EXPLORE SPORTS
                </a>

                <a href="register.html" class="btn-outline">
                    JOIN THE CLUB
                </a>

            </div>

        </div>


        <!-- Slide Dots -->

        <div class="dots">

            <span class="dot active"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>

    </section>


    <!-- =========================
         JAVASCRIPT SLIDESHOW
    ========================= -->

    <script>

        const slides =
            document.querySelectorAll(".slide");

        const dots =
            document.querySelectorAll(".dot");

        let currentSlide = 0;


        function showSlide(index) {

            slides.forEach(function(slide) {

                slide.classList.remove("active");

            });


            dots.forEach(function(dot) {

                dot.classList.remove("active");

            });


            slides[index].classList.add("active");

            dots[index].classList.add("active");

            currentSlide = index;
        }


        function nextSlide() {

            let next =
                (currentSlide + 1) % slides.length;

            showSlide(next);

        }


        /* Automatic change every 4 seconds */

        setInterval(nextSlide, 4000);


        /* Click dots to change image */

        dots.forEach(function(dot, index) {

            dot.addEventListener("click", function() {

                showSlide(index);

            });

        });

    </script>


</body>
</html>
